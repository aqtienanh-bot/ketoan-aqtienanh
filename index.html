<title>Kế toán AQ Tiến Anh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAF9F5; --surface-3:#F0EEE7;
  --ink:#1C1E22; --ink-soft:#585C64; --ink-faint:#8A8E97;
  --border:#E3E1D9; --border-strong:#CFCcC1;
  --accent:#1E6F5C; --accent-ink:#123f34; --accent-soft:#E4EFEB;
  --gold:#A9803F; --gold-soft:#F1E7D6;
  --good:#1E7A46; --warn:#9C6511; --bad:#B23B32;
  --shadow:0 1px 2px rgba(20,22,26,.04),0 8px 24px rgba(20,22,26,.06);
  --radius:10px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#14171A; --surface:#1D2126; --surface-2:#22262B; --surface-3:#282D33;
  --ink:#E9EAEC; --ink-soft:#9BA1A9; --ink-faint:#727880;
  --border:#31363C; --border-strong:#3E444B;
  --accent:#46B394; --accent-ink:#B9E4D8; --accent-soft:#1C2E2A;
  --gold:#C99C5D; --gold-soft:#2C2820;
  --good:#4CB477; --warn:#D69A3C; --bad:#E06A61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
} }
:root[data-theme="dark"]{
  --bg:#14171A; --surface:#1D2126; --surface-2:#22262B; --surface-3:#282D33;
  --ink:#E9EAEC; --ink-soft:#9BA1A9; --ink-faint:#727880;
  --border:#31363C; --border-strong:#3E444B;
  --accent:#46B394; --accent-ink:#B9E4D8; --accent-soft:#1C2E2A;
  --gold:#C99C5D; --gold-soft:#2C2820;
  --good:#4CB477; --warn:#D69A3C; --bad:#E06A61;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
button{font-family:inherit;font-size:14px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
a{color:var(--accent)}
.mono,td.num,th.num,input.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:auto 1fr;height:100vh}
#topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;height:56px;background:var(--surface);border-bottom:1px solid var(--border);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:7px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{font-weight:500;color:var(--ink-faint);letter-spacing:0}
.topbar-co{color:var(--ink-soft);font-weight:500;border-left:1px solid var(--border);padding-left:16px;max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid transparent}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,transparent)}
.pill.demo{background:var(--gold-soft);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.saved{font-size:12px;color:var(--ink-faint);min-width:96px}
.icbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;height:32px;padding:0 10px;color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.icbtn:hover{border-color:var(--border-strong);color:var(--ink)}

#nav{background:var(--surface);border-right:1px solid var(--border);padding:12px 10px;overflow-y:auto}
.nav-group{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);font-weight:700;margin:14px 10px 6px}
.nav-group:first-child{margin-top:2px}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;color:var(--ink-soft);text-decoration:none;font-weight:500}
.nav a .ni{width:16px;text-align:center;opacity:.8}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}

#main{overflow-y:auto;padding:22px 26px 60px}
.screen-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.screen-head h1{font-size:21px}
.screen-head p{margin:2px 0 0;color:var(--ink-soft);font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;height:34px;padding:0 14px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink-soft);border-color:var(--border)}
.btn.ghost:hover{color:var(--ink);border-color:var(--border-strong);background:var(--surface-2)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}

/* ---------- cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:18px}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);-webkit-overflow-scrolling:touch}
table.grid{border-collapse:collapse;width:100%;font-size:13.5px}
table.grid.wide{min-width:100%;table-layout:fixed}
table.grid.wide td .cell{white-space:normal;word-break:break-word}
table.grid.wide td input,table.grid.wide td select{text-overflow:ellipsis}
table.grid th,table.grid td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:0;text-align:left;vertical-align:middle}
table.grid th:last-child,table.grid td:last-child{border-right:none}
table.grid thead th{background:var(--surface-3);color:var(--ink-soft);font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;position:sticky;top:0;z-index:2;white-space:nowrap}
table.grid thead th.num{text-align:right}
table.grid tbody td{background:var(--surface)}
table.grid tbody tr:hover td{background:var(--surface-2)}
table.grid tbody tr:nth-child(even) td{background:var(--surface-2)}
table.grid tbody tr:nth-child(even):hover td{background:var(--surface-3)}
table.grid td .cell,table.grid td input,table.grid td select{width:100%;border:0;background:transparent;padding:8px 10px;outline:none}
table.grid td .cell{display:block;white-space:normal;word-break:break-word}
table.grid td input:focus,table.grid td select:focus{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
table.grid td.num input,table.grid td.num .cell{text-align:right}
table.grid td.ro .cell{color:var(--ink-soft)}
table.grid td.rownum{width:34px;text-align:center;color:var(--ink-faint);font-size:12px;font-family:var(--mono)}
table.grid td.act{width:38px;text-align:center}
table.grid td.act button{background:transparent;border:0;color:var(--ink-faint);font-size:15px;line-height:1;padding:6px}
table.grid td.act button:hover{color:var(--bad)}
table.grid tfoot td{background:var(--surface-3);font-weight:700;padding:8px 10px;border-top:2px solid var(--border-strong)}
table.grid tfoot td.num{text-align:right;font-family:var(--mono)}
.warn-chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);margin:0 8px}
.muted{color:var(--ink-faint)}
.empty{padding:26px;text-align:center;color:var(--ink-faint)}

/* ---------- form (company) ---------- */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.form-grid .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12px;font-weight:600;color:var(--ink-soft)}
.fld input,.fld select,.fld textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.sec-label{grid-column:1/-1;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:8px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--ink-soft);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;font-family:var(--mono);margin-top:6px;letter-spacing:-.02em}
.kpi .v.neg{color:var(--bad)}
.kpi .s{font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
#nav-back{display:none}
@media(max-width:900px){
  .two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
  #app{grid-template-columns:0 1fr}
  #main{padding:16px 14px 60px}
  .topbar-co{display:none}
  #tb-nav{display:inline-flex!important}
  #nav{position:fixed;inset:56px auto 0 0;width:250px;transform:translateX(-100%);transition:transform .2s;z-index:30;box-shadow:var(--shadow)}
  #nav.open{transform:none}
  #nav-back.show{display:block;position:fixed;inset:56px 0 0 0;background:rgba(0,0,0,.35);z-index:25}
}

/* ---------- overlay (activation + print prompt) ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,17,20,.55);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:100;padding:20px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);max-width:460px;width:100%;padding:26px}
.sheet h2{font-size:18px}
.sheet .lead{color:var(--ink-soft);font-size:13px;margin:6px 0 18px}
.sheet .err{color:var(--bad);font-size:12.5px;font-weight:600;min-height:18px;margin-top:8px}
.keyin{width:100%;font-family:var(--mono);font-size:16px;letter-spacing:.12em;text-align:center;text-transform:uppercase;border:1px solid var(--border-strong);border-radius:9px;padding:12px;background:var(--surface-2)}

/* ---------- print ---------- */
#print-root{display:none}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  #app,.overlay{display:none!important}
  #print-root{display:block!important;color:#000;font-size:12px}
  .pdoc{page-break-after:always}
  .pdoc:last-child{page-break-after:auto}
}
#print-root .pdoc{max-width:190mm;margin:0 auto 24px;background:#fff;color:#000;padding:10mm;border:1px solid #ccc}
@media print{#print-root .pdoc{border:0;padding:0;margin:0 auto}}
.pdoc .co{display:flex;justify-content:space-between;gap:20px;border-bottom:1.5px solid #000;padding-bottom:6px;font-size:11px}
.pdoc .co .co-name{font-weight:700;font-size:12.5px;text-transform:uppercase}
.pdoc .form-no{text-align:right;font-style:italic;font-size:10.5px}
.pdoc h3.pt{text-align:center;font-size:17px;margin:14px 0 2px;text-transform:uppercase}
.pdoc .pt-sub{text-align:center;font-size:11px;margin-bottom:12px}
.pdoc .meta{margin:8px 0;line-height:1.7}
.pdoc table{width:100%;border-collapse:collapse;margin:8px 0;font-size:11px}
.pdoc table th,.pdoc table td{border:1px solid #000;padding:4px 6px}
.pdoc table th{background:#eee;text-align:center}
.pdoc td.n{text-align:right;font-variant-numeric:tabular-nums}
.pdoc .treason{font-style:italic;margin-top:6px}
.pdoc .sig{display:flex;justify-content:space-around;margin-top:26px;text-align:center;font-size:11px}
.pdoc .sig b{display:block;font-weight:700}
.pdoc .sig i{font-size:10px}
.pdoc .wm{position:absolute}
.print-toolbar{position:fixed;top:0;left:0;right:0;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:10px;align-items:center;z-index:101}
@media print{.print-toolbar{display:none}}
body.printing #print-root{display:block;position:relative;z-index:100;background:var(--bg);min-height:100vh;padding:60px 16px 40px}
body.printing #app{display:none}

/* ---------- list toolbar / search ---------- */
.listbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.search{position:relative;flex:0 0 300px;max-width:100%}
.search input{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 12px 0 32px;background:var(--surface-2)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.search::before{content:"⌕";position:absolute;left:11px;top:50%;transform:translateY(-52%);color:var(--ink-faint);font-size:15px}
.count-chip{font-size:12px;color:var(--ink-faint);font-weight:600}

/* ---------- mini KPI strip ---------- */
.kpi-lite{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.kpi-lite .box{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);border-left:3px solid var(--accent)}
.kpi-lite .box.amber{border-left-color:var(--warn)}
.kpi-lite .box.red{border-left-color:var(--bad)}
.kpi-lite .box.gold{border-left-color:var(--gold)}
.kpi-lite .t{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.kpi-lite .n{font-size:17px;font-weight:700;font-family:var(--mono);margin-top:3px;letter-spacing:-.01em}

/* ---------- document (invoice-style) layout ---------- */
.docwrap{display:flex;flex-direction:column;gap:14px}
.doc-picker{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow)}
.doc-picker>select{height:34px;border:1px solid var(--border-strong);border-radius:8px;padding:0 10px;background:var(--surface-2);min-width:260px;font-size:13.5px;font-weight:600}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.doc-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.doc-h h2{font-size:15.5px;letter-spacing:.01em}
.doc-h .no{font-family:var(--mono);color:var(--accent-ink);font-weight:700}
.doc-body{padding:16px 18px}
.doc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 18px}
.doc-grid .fld.s2{grid-column:span 2}
.doc-grid .fld.s4{grid-column:1/-1}
.doc-grid .ro-val{border:1px dashed var(--border-strong);border-radius:8px;padding:8px 10px;background:var(--surface-3);color:var(--ink-soft);min-height:37px;font-size:13px}
.doc-sec{font-weight:700;margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.doc-tot{margin-top:14px;margin-left:auto;width:360px;max-width:100%;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden}
.doc-tot .r{display:flex;justify-content:space-between;gap:16px;padding:8px 14px;font-size:13.5px;border-bottom:1px solid var(--border)}
.doc-tot .r:last-child{border-bottom:0}
.doc-tot .r.big{background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.doc-tot .r .v{font-family:var(--mono);white-space:nowrap}
.doc-words{margin-top:8px;font-style:italic;color:var(--ink-soft);font-size:12.5px;text-align:right}
@media(max-width:900px){
  .doc-grid{grid-template-columns:1fr 1fr}
  .doc-grid .fld.s2,.doc-grid .fld.s4{grid-column:1/-1}
  .doc-tot{width:100%}
}

/* ---------- bản dùng thử ---------- */
#trial-ban{position:fixed;left:0;right:0;bottom:0;z-index:250;background:var(--warn);color:#fff;
  padding:8px 14px;font-size:12.5px;text-align:center;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
#trial-ban b{font-weight:700}
#trial-ban button{background:#fff;color:var(--warn);border:0;border-radius:6px;padding:4px 12px;font-weight:700;font-size:12px;cursor:pointer;margin-left:4px}
body.is-trial #main{padding-bottom:80px}
#print-root .pdoc{position:relative}
body.is-trial #print-root .pdoc::before{
  content:"DÙNG THỬ";position:absolute;top:40%;left:0;right:0;text-align:center;
  font-size:84px;font-weight:800;color:rgba(178,59,50,.13);transform:rotate(-24deg);letter-spacing:10px;pointer-events:none;z-index:0;
}
.pdoc .trial-note{margin-top:12px;text-align:center;font-size:9.5px;color:#b23b32;font-weight:700;letter-spacing:.5px}
</style>

<div id="app" class="hidden">
  <div id="topbar">
    <button class="icbtn" id="tb-nav" aria-label="Menu" style="display:none">☰</button>
    <div class="brand"><span class="mk">AQ</span> <span>Kế toán <small>AQ Tiến Anh</small></span></div>
    <div class="topbar-co" id="tb-co">—</div>
    <div class="topbar-sp"></div>
    <span class="saved" id="tb-saved"></span>
    <span id="tb-lic" class="pill ok">Bản quyền</span>
    <button class="icbtn" id="tb-menu">⋯ Dữ liệu</button>
    <button class="icbtn" id="tb-theme" title="Đổi giao diện sáng/tối">◐</button>
  </div>
  <nav id="nav"></nav>
  <div id="nav-back"></div>
  <main id="main"></main>
</div>

<div id="gate" class="overlay hidden">
  <div class="sheet">
    <h2>Kích hoạt bản quyền</h2>
    <p class="lead">Nhập <b>đúng tên đơn vị</b> (như trên giấy phép kinh doanh) và <b>mã kích hoạt</b> do nhà cung cấp cấp. Mỗi tên đơn vị có một mã riêng.</p>
    <div class="fld" style="margin-bottom:12px">
      <label>Tên đơn vị / hộ kinh doanh</label>
      <input id="g-name" placeholder="VD: CÔNG TY TNHH ABC" autocomplete="off">
    </div>
    <div class="fld">
      <label>Mã kích hoạt</label>
      <input id="g-code" class="keyin" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" autocomplete="off">
    </div>
    <div class="err" id="g-err"></div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn ghost" id="g-cancel" style="flex:1">Dùng thử tiếp</button>
      <button class="btn" id="g-activate" style="flex:1">Kích hoạt</button>
    </div>
    <p class="lead" id="g-buy" style="margin:14px 0 0;font-size:12px"></p>
  </div>
</div>

<div id="print-root"></div>

<script>
/* Lõi bản quyền — dùng chung với công cụ tạo mã (keygen.html). Đổi SALT = vô hiệu mọi mã đã phát. */
(function(root){
  var S=[0x41,0x51,0x54,0x41];
  var SALT=String.fromCharCode.apply(null,S)+'::keToan::v1::9c3f8ae1-quyen';
  var RE_MARKS=new RegExp('[\\u0300-\\u036f]','g');
  function stripVN(s){return (s||'').normalize('NFD').replace(RE_MARKS,'').replace(/đ/g,'d').replace(/Đ/g,'D');}
  function norm(name){return stripVN(String(name)).toUpperCase().replace(/[^A-Z0-9]/g,'');}
  function cyrb53(str,seed){var h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0);}
  var AB='0123456789ABCDEFGHJKLMNPQRSTUVWXYZ';
  function toBase(n,len){var o='';for(var i=0;i<len;i++){o=AB[n%AB.length]+o;n=Math.floor(n/AB.length);}return o;}

        }else if(c.type==="select"){
          var sel=el("select");
          (typeof c.opts==="function"?c.opts():c.opts).forEach(function(o){
            var op=el("option",{value:(o.v!=null?o.v:o)});op.textContent=(o.t!=null?o.t:o);if(String(row[c.k])===String(o.v!=null?o.v:o))op.selected=true;sel.appendChild(op);
          });
          if(!c.req){var blank=el("option",{value:""});blank.textContent="—";if(!row[c.k])blank.selected=true;sel.insertBefore(blank,sel.firstChild);}
          sel.addEventListener("change",function(){row[c.k]=sel.value;stampRow(row);commit();});
          td.appendChild(sel);
        }else{
          var inp=el("input",{type:c.type==="date"?"date":"text"});
          if(c.type==="money"||c.type==="number"){inp.className="num";inp.value=row[c.k]!=null&&row[c.k]!==""?fmt2(row[c.k]):"";inp.inputMode="decimal";}
          else inp.value=row[c.k]==null?"":row[c.k];
          if(c.ph)inp.placeholder=c.ph;
          inp.addEventListener("change",function(){
            row[c.k]=(c.type==="money"||c.type==="number")?num(inp.value):inp.value;
            stampRow(row);commit();
          });
          td.appendChild(inp);
        }
        tr.appendChild(td);
      });
      var tdA=el("td",{class:"act"});
      var del=el("button",{title:"Xoá dòng",html:"&times;"});
      del.addEventListener("click",function(){if(confirm("Xoá dòng này?")){var host=(opts.store?opts.store():opts.rows());var idx=host.indexOf(row);if(idx>-1)host.splice(idx,1);if(opts.coll)markTomb(opts.coll,row.id);commit();}});
      tdA.appendChild(del);tr.appendChild(tdA);
      tbody.appendChild(tr);
    });
    renderFoot();
    if(opts.onrender)opts.onrender(rows.length);
  }
  function renderFoot(){
    tfoot.innerHTML="";
    if(!opts.foot)return;
    var f=opts.foot(opts.rows());
    if(!f)return;
    var tr=el("tr");tr.appendChild(el("td",{text:""}));
    opts.cols.forEach(function(c){var td=el("td");if(c.type==="money"||c.type==="number"){td.className="num";td.textContent=f[c.k]!=null?fmt(f[c.k]):"";}else td.textContent=f[c.k]!=null?f[c.k]:"";tr.appendChild(td);});
    tr.appendChild(el("td"));tfoot.appendChild(tr);
  }
  function commit(){save();renderBody();if(opts.onchange)opts.onchange();}
  wrap.appendChild(tbl);
  renderBody();
  return {node:wrap,refresh:renderBody};
}

function download(name,text,mime){
  var blob=new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
  var a=el("a",{href:URL.createObjectURL(blob),download:name});document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(a.href)},500);
}
function toCSV(cols,rows){
  var head=cols.map(function(c){return '"'+c.label.replace(/"/g,'""')+'"'}).join(",");
  var body=rows.map(function(r){return cols.map(function(c){
    var v=c.calc?c.calc(r):r[c.k];if(v==null)v="";
    return '"'+String(v).replace(/"/g,'""')+'"';
  }).join(",")}).join("\r\n");
  return "﻿"+head+"\r\n"+body;
}

function pickJson(cb){
  var inp=el("input",{type:"file",accept:".json,application/json"});
  inp.addEventListener("change",function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){try{var raw=JSON.parse(rd.result);cb(raw&&raw.db?raw.db:raw);}catch(e){alert("Lỗi đọc file: "+e.message);}};
    rd.readAsText(f);});
  inp.click();
}

var SALE_CSV=[{k:"soPhieu",label:"Số phiếu"},{k:"ngay",label:"Ngày"},{k:"maDT",label:"Mã KH"},{k:"maHang",label:"Mã hàng"},{k:"soLuong",label:"Số lượng"},{k:"donGia",label:"Đơn giá bán"},{k:"doanhThu",label:"Doanh thu",calc:function(r){return saleCalc(r).doanhThu}},{k:"giaVon",label:"Giá vốn",calc:function(r){return saleCalc(r).giaVon}},{k:"laiGop",label:"Lãi gộp",calc:function(r){return saleCalc(r).laiGop}},{k:"thue",label:"% thuế"},{k:"tienThue",label:"Tiền thuế",calc:function(r){return saleCalc(r).tienThue}},{k:"tongThu",label:"Tổng thu",calc:function(r){return saleCalc(r).tongThu}},{k:"dienGiai",label:"Diễn giải"}];

function voucherDoc(m,kind){
  var isNhap=kind==="nhap", KEY=isNhap?"purchases":"sales", PFX=isNhap?"PN":"PX";
  var partyLbl=isNhap?"Nhà cung cấp":"Khách hàng";
  function lines(no){return DB[KEY].filter(function(r){return r.soPhieu===no})}
  function vlist(){var seen={},a=[];DB[KEY].forEach(function(r){var n=r.soPhieu||"";if(!seen[n]){seen[n]=1;a.push(n)}});return a}
  function mkLine(no,b){b=b||{};return {id:uid(),_v:nowv(),soPhieu:no,ngay:b.ngay||today(),maDT:b.maDT||"",dienGiai:b.dienGiai||"",maHang:"",soLuong:1,donGia:0,thue:b.thue!=null?b.thue:0.08,nguoiGiao:b.nguoiGiao||"",nvBan:b.nvBan||"",thuKho:b.thuKho||"",httt:b.httt||"",ghiChu:""}}
  function rerender(){var mm=$("#main");mm.innerHTML="";voucherDoc(mm,kind);mm.scrollTop=0;}

  var vs=vlist(), cur=curVoucher[KEY];
  if(!cur||vs.indexOf(cur)<0)cur=vs.length?vs[vs.length-1]:null;
  curVoucher[KEY]=cur;

  m.appendChild(head(
    isNhap?"Phiếu mua hàng / Nhập kho":"Phiếu bán hàng / Xuất kho",
    isNhap?"Chọn nhà cung cấp, thêm các dòng hàng — phần mềm tự tính thành tiền, thuế GTGT và tổng thanh toán"
          :"Chọn khách hàng, thêm các dòng hàng — giá vốn tính bình quân gia quyền cả kỳ, tự hiện lãi gộp"
  ));

  var wrap=el("div",{class:"docwrap"});

  /* ---- thanh chọn chứng từ ---- */
  var pick=el("div",{class:"doc-picker"});
  pick.appendChild(el("span",{text:"Chứng từ:",style:"font-weight:700;color:var(--ink-soft)"}));
  var sel=el("select");
  if(!vs.length){sel.appendChild(el("option",{value:"",text:"(chưa có phiếu nào)"}));}
  vs.slice().reverse().forEach(function(n){
    var f0=lines(n)[0]||{};
    var op=el("option",{value:n,text:n+"  ·  "+(dmy(f0.ngay)||"?")+"  ·  "+(partnerName(f0.maDT)||"—")});
    if(n===cur)op.selected=true;sel.appendChild(op);
  });
  sel.addEventListener("change",function(){curVoucher[KEY]=sel.value;rerender();});
  pick.appendChild(sel);
  pick.appendChild(toolbarBtn("+ Lập phiếu mới",function(){
    var no=nextNo(KEY,"soPhieu",PFX);DB[KEY].push(mkLine(no,lines(cur)[0]||{}));curVoucher[KEY]=no;save();rerender();
  }));
  if(cur){
    pick.appendChild(toolbarBtn("🖨 In phiếu",function(){printVoucher(kind,cur)},true));
    pick.appendChild(toolbarBtn("🗑 Xoá phiếu này",function(){
      if(confirm("Xoá toàn bộ phiếu "+cur+" ("+lines(cur).length+" dòng hàng)?")){
        lines(cur).forEach(function(r){markTomb(KEY,r.id)});
        DB[KEY]=DB[KEY].filter(function(r){return r.soPhieu!==cur});curVoucher[KEY]=null;save();rerender();
      }
    },true));
  }
  pick.appendChild(toolbarBtn("Xuất CSV toàn bộ",function(){
    download(isNhap?"phieu-mua.csv":"phieu-ban.csv",toCSV(isNhap?PURCHASE_CSV:SALE_CSV,DB[KEY]),"text/csv");
  },true));
  wrap.appendChild(pick);

  if(!cur){
    wrap.appendChild(el("div",{class:"card card-pad empty",html:"Chưa có phiếu nào. Bấm <b>+ Lập phiếu mới</b> để bắt đầu."}));
    m.appendChild(wrap);return;
  }

  var grp=lines(cur), h0=grp[0];
  function setHeader(f,v){DB[KEY].forEach(function(r){if(r.soPhieu===cur){r[f]=v;stampRow(r);}});save();}
  function renameVoucher(nv){nv=(nv||"").trim();if(!nv||nv===cur)return;
    if(vlist().indexOf(nv)>=0){toast("Số phiếu “"+nv+"” đã tồn tại");rerender();return;}
    DB[KEY].forEach(function(r){if(r.soPhieu===cur){r.soPhieu=nv;stampRow(r);}});curVoucher[KEY]=nv;save();rerender();}

  var card=el("div",{class:"doc-card"});
  var dh=el("div",{class:"doc-h"});
  dh.appendChild(el("h2",{text:isNhap?"PHIẾU NHẬP KHO":"PHIẾU XUẤT KHO — BÁN HÀNG"}));
  dh.appendChild(el("span",{class:"no",text:"Số "+cur}));
  card.appendChild(dh);
  var body=el("div",{class:"doc-body"});
  var dg=el("div",{class:"doc-grid"});
  function fld(label,cls){var f=el("div",{class:"fld"+(cls?" "+cls:"")});f.appendChild(el("label",{text:label}));return f}

  var f1=fld("Số phiếu");var i1=el("input",{value:cur});i1.addEventListener("change",function(){renameVoucher(i1.value)});f1.appendChild(i1);dg.appendChild(f1);
  var f2=fld("Ngày chứng từ");var i2=el("input",{type:"date"});i2.value=(h0.ngay||"").slice(0,10);i2.addEventListener("change",function(){setHeader("ngay",i2.value);rerender()});f2.appendChild(i2);dg.appendChild(f2);

  var f3=fld(partyLbl,"s2");var s3=el("select");
  s3.appendChild(el("option",{value:"",text:"— chọn "+partyLbl.toLowerCase()+" —"}));
  partnerOpts(partyLbl).forEach(function(o){var op=el("option",{value:o.v,text:o.t});if(o.v===h0.maDT)op.selected=true;s3.appendChild(op)});
  s3.addEventListener("change",function(){setHeader("maDT",s3.value);rerender()});
  f3.appendChild(s3);dg.appendChild(f3);

  var pn=DB.partners.filter(function(p){return p.ma===h0.maDT})[0]||{};
  [["Mã số thuế / CCCD",pn.mst],["Điện thoại",pn.dienThoai],["Địa chỉ",pn.diaChi,"s2"],["Người liên hệ",pn.lienHe]].forEach(function(x){
    var f=fld(x[0],x[2]);f.appendChild(el("div",{class:"ro-val",text:x[1]||"—"}));dg.appendChild(f);
  });

  var f4=fld("Diễn giải","s4");var i4=el("input",{value:h0.dienGiai||"",placeholder:isNhap?"VD: Mua hàng nhập kho tháng ...":"VD: Bán hàng cho khách ..."});
  i4.addEventListener("change",function(){setHeader("dienGiai",i4.value)});f4.appendChild(i4);dg.appendChild(f4);

  var fa=fld(isNhap?"Người giao hàng":"Nhân viên bán hàng");
  var ia=el("input",{value:(isNhap?h0.nguoiGiao:h0.nvBan)||""});
  ia.addEventListener("change",function(){setHeader(isNhap?"nguoiGiao":"nvBan",ia.value)});fa.appendChild(ia);dg.appendChild(fa);
  var fb=fld(isNhap?"Thủ kho nhập":"Thủ kho xuất");var ib=el("input",{value:h0.thuKho||""});
  ib.addEventListener("change",function(){setHeader("thuKho",ib.value)});fb.appendChild(ib);dg.appendChild(fb);
  if(isNhap){
    var fc=fld("Hình thức thanh toán");var sc=el("select");
    sc.appendChild(el("option",{value:"",text:"—"}));
    ["Tiền mặt","Chuyển khoản","Công nợ","Khác"].forEach(function(o){var op=el("option",{value:o,text:o});if(o===h0.httt)op.selected=true;sc.appendChild(op)});
    sc.addEventListener("change",function(){setHeader("httt",sc.value)});fc.appendChild(sc);dg.appendChild(fc);
  }
  body.appendChild(dg);

  body.appendChild(el("div",{class:"doc-sec",text:"Chi tiết hàng hoá"}));
  var lineCols=[
    {k:"maHang",label:"Mã hàng",type:"select",opts:itemOpts,w:"170px"},
    {k:"_ten",label:"Tên hàng / vật tư",ro:true,calc:function(r){return itemName(r.maHang)},w:"230px"},
    {k:"_dvt",label:"ĐVT",ro:true,calc:function(r){return itemUom(r.maHang)},w:"64px"},
    {k:"soLuong",label:"Số lượng",type:"number",w:"100px"},
    {k:"donGia",label:isNhap?"Đơn giá":"Đơn giá bán",type:"money",w:"120px"},
    {k:"_tt",label:"Thành tiền",ro:true,type:"money",calc:function(r){return isNhap?purchaseCalc(r).thanhTien:saleCalc(r).doanhThu},w:"130px"},
    {k:"thue",label:"% GTGT",type:"select",opts:THUE_OPTS,w:"84px"},
    {k:"_th",label:"Tiền thuế GTGT",ro:true,type:"money",calc:function(r){return isNhap?purchaseCalc(r).tienThue:saleCalc(r).tienThue},w:"120px"}
  ];
  if(!isNhap){
    lineCols.push({k:"_gv",label:"Giá vốn",ro:true,type:"money",calc:function(r){return saleCalc(r).giaVon},w:"115px"});
    lineCols.push({k:"_lg",label:"Lãi gộp",ro:true,type:"money",calc:function(r){return saleCalc(r).laiGop},w:"115px"});
  }
  lineCols.push({k:"ghiChu",label:"Ghi chú",w:"150px"});

  var totBox=el("div",{class:"doc-tot"});
  var wordsEl=el("div",{class:"doc-words"});
  function totals(){
    var tt=0,th=0,gv=0;lines(cur).forEach(function(r){var c=isNhap?purchaseCalc(r):saleCalc(r);tt+=(isNhap?c.thanhTien:c.doanhThu);th+=c.tienThue;if(!isNhap)gv+=saleCalc(r).giaVon;});
    return {tt:tt,th:th,gv:gv};
  }
  function paintTotals(){
    var x=totals();totBox.innerHTML="";
    function r(k,v,big){var d=el("div",{class:"r"+(big?" big":"")});d.appendChild(el("span",{text:k}));d.appendChild(el("span",{class:"v",text:fmt(v)+" ₫"}));totBox.appendChild(d)}
    r("Tổng tiền hàng",x.tt);
    r("Thuế GTGT",x.th);
    if(!isNhap){r("Giá vốn hàng bán",x.gv);r("Lãi gộp",x.tt-x.gv);}
    r(isNhap?"TỔNG TIỀN THANH TOÁN":"TỔNG THU CỦA KHÁCH",x.tt+x.th,true);
    wordsEl.textContent="Bằng chữ: "+docTien(x.tt+x.th)+".";
  }

  var lg=grid({cols:lineCols,rows:function(){return lines(cur)},store:function(){return DB[KEY]},coll:KEY,
    onchange:paintTotals,
    foot:function(rs){var f={},tt=0,th=0;rs.forEach(function(r){var c=isNhap?purchaseCalc(r):saleCalc(r);tt+=(isNhap?c.thanhTien:c.doanhThu);th+=c.tienThue});f._tt=tt;f._th=th;f._ten="CỘNG";return f;}
  });
  body.appendChild(lg.node);

  var lb=el("div",{style:"display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"});
  lb.appendChild(toolbarBtn("+ Thêm dòng hàng",function(){DB[KEY].push(mkLine(cur,lines(cur)[0]||h0));save();lg.refresh();paintTotals();},true));
  lb.appendChild(toolbarBtn("Xoá hết dòng",function(){
    if(confirm("Xoá hết dòng hàng của phiếu "+cur+"?")){lines(cur).forEach(function(r){markTomb(KEY,r.id)});DB[KEY]=DB[KEY].filter(function(r){return r.soPhieu!==cur});DB[KEY].push(mkLine(cur,h0));save();rerender();}
  },true));
  body.appendChild(lb);

  paintTotals();
  body.appendChild(totBox);
  body.appendChild(wordsEl);
  card.appendChild(body);
  wrap.appendChild(card);
  m.appendChild(wrap);
}

/* ---------------- bản quyền: dùng thử mặc định, nhập mã để mở khoá ---------------- */
function getLic(){try{return JSON.parse(store.get(LS_LIC))}catch(e){return null}}
function setLic(l){store.set(LS_LIC,JSON.stringify(l));}
function licHashOK(l){return !!(l&&window.AQLicense&&AQLicense.verify(l.name,l.code));}
function licNorm(s){return window.AQLicense?AQLicense.norm(s):String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
/* Bản quyền hợp lệ khi: mã đúng tên + đúng thiết bị + tên trên giấy phép trùng tên đơn vị hiện tại */
function licOK(){
  var l=getLic();
  if(!licHashOK(l))return false;
  if(l.dev&&l.dev!==deviceId())return false;
  var cur=(co().ten||"").trim();
  if(cur&&licNorm(l.name)!==licNorm(cur))return false;
  return true;
}
function isTrial(){return !licOK();}
function checkLicenseBadge(){
  var b=$("#tb-lic");if(!b)return;
  if(licOK()){b.textContent="✓ Bản quyền";b.className="pill ok";b.title="Cấp cho: "+((getLic()||{}).name||co().ten);}
  else{b.textContent="Dùng thử";b.className="pill demo";b.title="Chưa kích hoạt — bấm để nhập mã / mua bản quyền";}
}
function applyTrialUI(){
  var t=isTrial();
  document.body.classList.toggle("is-trial",t);
  var ban=$("#trial-ban");
  if(t){
    if(!ban){ban=el("div",{id:"trial-ban"});document.body.appendChild(ban);}
    ban.innerHTML="<b>BẢN DÙNG THỬ</b> — dùng đủ chức năng, nhưng phiếu &amp; báo cáo in ra có chữ mờ “DÙNG THỬ”. &nbsp;"
      +esc(VENDOR)+" &nbsp;<button id='trial-key'>Nhập mã kích hoạt</button>";
    var bk=$("#trial-key");if(bk)bk.onclick=openGate;
  }else if(ban){ban.remove();}
  checkLicenseBadge();
}
function openGate(){
  var g=$("#gate");g.classList.remove("hidden");
  $("#g-err").textContent="";
  var bp=$("#g-buy");if(bp)bp.textContent=VENDOR;
  var l=getLic();
  $("#g-name").value=co().ten||(l&&l.name)||"";
  $("#g-code").value="";
  $("#g-cancel").onclick=function(){g.classList.add("hidden");};
  $("#g-activate").onclick=function(){
    var name=$("#g-name").value.trim(),code=$("#g-code").value.trim();
    if(!name){$("#g-err").textContent="Nhập tên đơn vị.";return;}
    if(!AQLicense.verify(name,code)){$("#g-err").textContent="Mã không đúng với tên đơn vị này. Kiểm tra lại tên (đúng như giấy phép) và mã.";return;}
    setLic({name:name,code:code.toUpperCase(),at:today(),dev:deviceId()});
    DB.company.ten=name;co()._v=nowv();save();
    g.classList.add("hidden");
    toast("Đã kích hoạt bản quyền. Cảm ơn bạn!");
    applyTrialUI();$("#tb-co").textContent=co().ten||"—";
  };
  $("#g-code").onkeydown=function(e){if(e.key==="Enter")$("#g-activate").click();};
}
function bootGate(){startApp();applyTrialUI();}
function startApp(){
  $("#app").classList.remove("hidden");
  buildNav();checkLicenseBadge();
  window.addEventListener("hashchange",route);
  var nav=$("#nav"),back=$("#nav-back");
  function closeNav(){nav.classList.remove("open");back.classList.remove("show");}
  $("#tb-nav").addEventListener("click",function(){nav.classList.toggle("open");back.classList.toggle("show");});
  back.addEventListener("click",closeNav);
  nav.addEventListener("click",function(e){if(e.target.closest("a"))closeNav();});
  route();save();
  $("#tb-lic").addEventListener("click",openGate);
  $("#tb-theme").addEventListener("click",function(){
    var cur=document.documentElement.getAttribute("data-theme");
    var next=cur==="dark"?"light":(cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark"));
    document.documentElement.setAttribute("data-theme",next);store.set(LS_THEME,next);
  });
  $("#tb-menu").addEventListener("click",function(){
    var m=el("div",{class:"overlay"});
    var s=el("div",{class:"sheet"});
    s.innerHTML="<h2>Dữ liệu &amp; sao lưu</h2><p class=lead>Dữ liệu lưu trong trình duyệt máy này. Sao lưu thường xuyên; chuyển máy hoặc gộp số liệu bằng “gói đồng bộ .json”.</p>";
    var items=[
     ["⇄ Nhập &amp; trộn gói đồng bộ (.json)",syncImport],
     ["⤴ Xuất gói đồng bộ (.json)",syncExport],
     ["⤓ Sao lưu toàn bộ (.json)",backup],
     ["⤒ Phục hồi — thay thế bằng file .json",restore],
     ["⊞ Xuất sổ sách ra Excel (.xls)",exportAllXls],
     ["✕ Xoá toàn bộ dữ liệu trên máy này",function(){if(confirm("Xoá sạch dữ liệu kế toán trên máy này? Nên Sao lưu .json trước.")){store.del(LS_DB);location.reload();}}]
    ];
    items.forEach(function(x){var b=el("button",{class:"btn ghost",html:x[0],style:"width:100%;justify-content:flex-start;margin-top:8px"});b.addEventListener("click",function(){m.remove();x[1]();});s.appendChild(b);});
    var close=el("button",{class:"btn",text:"Đóng",style:"width:100%;margin-top:14px"});close.addEventListener("click",function(){m.remove()});s.appendChild(close);
    m.appendChild(s);m.addEventListener("click",function(e){if(e.target===m)m.remove()});document.body.appendChild(m);
  });
}
function exportAllXls(){
  function tbl(title,cols,rows){
    return "<h3>"+esc(title)+"</h3><table border=1><tr>"+cols.map(function(c){return "<th>"+esc(c.label)+"</th>"}).join("")+"</tr>"+
    rows.map(function(r){return "<tr>"+cols.map(function(c){var v=c.calc?c.calc(r):r[c.k];return "<td>"+esc(v==null?"":v)+"</td>"}).join("")+"</tr>"}).join("")+"</table><br>";
  }
  var h="<html><head><meta charset=utf-8></head><body>";
  h+="<h2>"+esc(co().ten)+" — Sổ sách kế toán</h2>";
  h+=tbl("Nhân sự",[{k:"hoTen",label:"Họ tên"},{k:"chucVu",label:"Chức vụ"},{k:"vaiTro",label:"Vai trò"},{k:"dienThoai",label:"Điện thoại"},{k:"email",label:"Email"},{k:"luong",label:"Lương"}],DB.staff);
  h+=tbl("Đối tác",[{k:"ma",label:"Mã"},{k:"ten",label:"Tên"},{k:"loai",label:"Loại"},{k:"mst",label:"MST"},{k:"dienThoai",label:"ĐT"}],DB.partners);
  h+=tbl("Danh mục vật tư",[{k:"ma",label:"Mã"},{k:"ten",label:"Tên"},{k:"dvt",label:"ĐVT"},{k:"donGiaMua",label:"Đơn giá"},{k:"slDau",label:"Tồn đầu"}],DB.materials);
  h+=tbl("Danh mục hàng hóa",[{k:"ma",label:"Mã"},{k:"ten",label:"Tên"},{k:"dvt",label:"ĐVT"},{k:"donGiaMua",label:"Giá mua"},{k:"donGiaBan",label:"Giá bán"},{k:"slDau",label:"Tồn đầu"}],DB.goods);
  h+=tbl("Sổ kho NXT",[{k:"ma",label:"Mã"},{k:"ten",label:"Tên"},{k:"slDau",label:"SL đầu"},{k:"slNhap",label:"SL nhập"},{k:"slXuat",label:"SL xuất"},{k:"slCuoi",label:"SL cuối"},{k:"gtriCuoi",label:"Giá trị cuối"}],stockRows());
  h+="</body></html>";
  download("so-sach-"+today()+".xls",h,"application/vnd.ms-excel");
}

/* ---------------- boot ---------------- */
(function(){
  var th=store.get(LS_THEME);if(th)document.documentElement.setAttribute("data-theme",th);
  load();
  if(/[?&]debug/.test(location.search))window.__ktDebug={mergeDB:mergeDB,normalizeDB:normalizeDB,get DB(){return DB}};
  bootGate();
})();
})();
</script>
